name: Fix websocket-driver and build frontend

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-websocket-driver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Régénérer les dépendances
        run: npm install --legacy-peer-deps

      - name: Vérifier websocket-driver
        run: npm ls websocket-driver

      - name: Compiler le frontend
        env:
          CI: true
        run: npm run build

      - name: Enregistrer package.json et package-lock.json
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Aucun changement de dépendances à enregistrer."
          else
            git commit -m "Fix websocket-driver security vulnerability"
            git push
          fi
