name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # --legacy-peer-deps is required because react 19 has peer conflicts with
        # some packages that declare react <=18 as a peer dependency.
        run: npm install --legacy-peer-deps

      - name: Run tests
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

  backend:
    name: Backend (syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile sources (syntax check)
        run: python -m compileall -q .

      - name: Test booking maps and anti-abuse controls
        working-directory: .
        run: python -m unittest tests.test_booking_map tests.test_admin_regressions tests.test_stripe_checkout tests.test_cors_config

      # NOTE: backend_test.py is an integration script that targets a remote
      # deployed environment (https://driver-platform-28.preview.emergentagent.com)
      # and requires a running MongoDB instance. It is intentionally NOT run here
      # to avoid systematic failures. Run it manually against a live backend.

  billing:
    name: Billing (isolated MongoDB)
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://127.0.0.1:27017/?directConnection=true
      DB_NAME: unused_billing_test
      JWT_SECRET: isolated-ci-test-secret
      MONGO_TEST_URL: mongodb://127.0.0.1:27017/?directConnection=true&replicaSet=copilotTest
      MONGO_STANDALONE_TEST_URL: mongodb://127.0.0.1:27018/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Start isolated database servers
        run: |
          docker run --rm -d --name billing-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet copilotTest --bind_ip_all
          docker run --rm -d --name billing-standalone -p 127.0.0.1:27018:27017 mongo:7 --bind_ip_all
          python - <<'PY'
          import time
          from pymongo import MongoClient
          from pymongo.errors import PyMongoError
          for port in (27017, 27018):
              with MongoClient(f"mongodb://127.0.0.1:{port}/?directConnection=true", serverSelectionTimeoutMS=1000) as client:
                  for attempt in range(60):
                      try:
                          client.admin.command("ping")
                          break
                      except PyMongoError:
                          time.sleep(1)
                  else:
                      raise RuntimeError("Test MongoDB did not become ready")
          with MongoClient("mongodb://127.0.0.1:27017/?directConnection=true") as client:
              client.admin.command("replSetInitiate", {
                  "_id": "copilotTest", "members": [{"_id": 0, "host": "localhost:27017"}]
              })
              for attempt in range(60):
                  if client.admin.command("hello").get("isWritablePrimary"):
                      break
                  time.sleep(1)
              else:
                  raise RuntimeError("Test replica set did not elect a primary")
          PY
      - name: Test billing without external provider calls
        run: |
          python -m unittest tests.test_charge_drafts tests.test_booking_charges \
            tests.test_supplementary_ledger tests.test_supplementary_billing \
            tests.test_supplementary_api tests.test_billing_workflow \
            tests.test_supplementary_invoice_pdf tests.test_pdf_generation \
            tests.test_driver_emails tests.test_invoice_email
      - name: Stop isolated databases
        if: always()
        run: docker stop billing-mongo billing-standalone
